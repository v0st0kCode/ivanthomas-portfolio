<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="100%" stop-color="#0A2A20"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1F24"/>
      <stop offset="100%" stop-color="#101215"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#E9EAEC"/>

  <!-- iPad frame -->
  <rect x="80" y="60" width="1120" height="680" rx="28" fill="url(#bezel)"/>
  <rect x="104" y="84" width="1072" height="632" rx="10" fill="#0A0D12"/>

  <!-- Top bar -->
  <g font-family="Inter, sans-serif">
    <circle cx="150" cy="122" r="10" fill="#3B4450"/>
    <text x="170" y="127" fill="#C7CCD3" font-size="15" font-weight="600">TM A</text>
    <text x="620" y="130" fill="#F4F6F8" font-size="26" font-weight="700" text-anchor="middle">1 — 0</text>
    <circle cx="1090" cy="122" r="10" fill="#3B4450"/>
    <text x="1070" y="127" fill="#C7CCD3" font-size="15" font-weight="600" text-anchor="end">TM B</text>
    <text x="620" y="106" fill="#8A93A0" font-size="12" text-anchor="middle" letter-spacing="1">67:12 · 2ND HALF</text>
  </g>

  <!-- Video area -->
  <rect x="128" y="160" width="740" height="486" rx="8" fill="url(#pitch)"/>
  <g stroke="#1E5B44" stroke-width="2" fill="none" opacity="0.8">
    <rect x="150" y="182" width="696" height="442"/>
    <line x1="498" y1="182" x2="498" y2="624"/>
    <circle cx="498" cy="403" r="60"/>
    <rect x="150" y="313" width="90" height="180"/>
    <rect x="756" y="313" width="90" height="180"/>
  </g>
  <!-- player dots -->
  <g>
    <circle cx="330" cy="300" r="9" fill="#3E8EF7"/>
    <circle cx="410" cy="420" r="9" fill="#3E8EF7"/>
    <circle cx="560" cy="260" r="9" fill="#3E8EF7"/>
    <circle cx="600" cy="470" r="9" fill="#E14C4C"/>
    <circle cx="700" cy="360" r="9" fill="#E14C4C"/>
    <circle cx="470" cy="403" r="7" fill="#F5C542"/>
  </g>

  <!-- Timeline scrubber -->
  <rect x="150" y="600" width="696" height="34" rx="6" fill="#12161D" opacity="0.9"/>
  <g fill="#2A3038">
    <rect x="160" y="612" width="676" height="4" rx="2"/>
  </g>
  <rect x="160" y="612" width="410" height="4" rx="2" fill="#22D3A5"/>
  <circle cx="570" cy="614" r="7" fill="#22D3A5"/>
  <g fill="#5B6472" font-size="10" font-family="Space Mono, monospace">
    <text x="160" y="642">00:00</text>
    <text x="820" y="642" text-anchor="end">90:00</text>
  </g>

  <!-- Right sidebar: stat chips -->
  <g font-family="Inter, sans-serif">
    <rect x="888" y="160" width="288" height="486" rx="10" fill="#12161D"/>
    <text x="912" y="196" fill="#8A93A0" font-size="12" letter-spacing="1">LIVE STATS</text>

    <g>
      <rect x="912" y="216" width="240" height="72" rx="8" fill="#171C24"/>
      <text x="932" y="248" fill="#8A93A0" font-size="12">xG</text>
      <text x="932" y="274" fill="#F4F6F8" font-size="26" font-weight="700">0.42</text>
    </g>
    <g>
      <rect x="912" y="300" width="240" height="72" rx="8" fill="#171C24"/>
      <text x="932" y="332" fill="#8A93A0" font-size="12">Pass accuracy</text>
      <text x="932" y="358" fill="#F4F6F8" font-size="26" font-weight="700">88%</text>
    </g>
    <g>
      <rect x="912" y="384" width="240" height="72" rx="8" fill="#171C24"/>
      <text x="932" y="416" fill="#8A93A0" font-size="12">High-intensity sprints</text>
      <text x="932" y="442" fill="#F4F6F8" font-size="26" font-weight="700">14</text>
    </g>
    <g>
      <rect x="912" y="468" width="240" height="72" rx="8" fill="#171C24"/>
      <text x="932" y="500" fill="#8A93A0" font-size="12">Possession</text>
      <text x="932" y="526" fill="#F4F6F8" font-size="26" font-weight="700">57%</text>
    </g>

    <text x="912" y="576" fill="#8A93A0" font-size="12" letter-spacing="1">TAP FOR DEPTH</text>
    <rect x="912" y="590" width="240" height="40" rx="8" fill="#171C24" stroke="#22D3A5" stroke-width="1"/>
    <text x="932" y="615" fill="#C7CCD3" font-size="13">Full analysis view →</text>
  </g>

  <text x="1176" y="770" fill="#9AA0A8" font-size="12" text-anchor="end" font-family="Inter, sans-serif">Mockup with simulated data — not a real screenshot</text>
</svg>
